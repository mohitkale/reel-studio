name: npm package checks
# Build an unpublished archive and verify its first start on all three operating systems.
on:
  pull_request:
    paths:
      - ".github/workflows/npm-package-checks.yml"
      - "bin/reel-studio.mjs"
      - "scripts/package-*.mjs"
      - "scripts/smoke-npm-package.mjs"
      - "scripts/installed-environment.mjs"
      - "scripts/supervise.mjs"
  workflow_call:
permissions:
  contents: read

jobs:
  phonemizer:
    uses: ./.github/workflows/phonemizer-source.yml
  npm-candidate:
    needs: [phonemizer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-built-phonemizer
          path: phonemizer-source
      - run: npm ci
      - run: npm run voice:download
      - name: Build the standalone package and separate voice pack
        run: |
          source=$(find phonemizer-source -name reel-phonemizer-corresponding-source.tar.gz -print -quit)
          test -n "$source"
          npm run package:npm -- --voice-source "$source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reel-studio-npm-candidate
          path: |
            .artifacts/npm-package/candidate-*/mohitkale-reel-studio-*.tgz
            .artifacts/npm-package/candidate-*/reel-kokoro-voice-pack.json.gz
            .artifacts/npm-package/candidate-*/pack-report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  npm-smoke:
    needs: [npm-candidate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          # The cold check overrides this cache with an empty directory.
          cache: ${{ runner.os == 'Windows' && 'npm' || '' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reel-studio-npm-candidate
          path: npm-candidate
      - name: Start with only Node from a clean directory
        shell: bash
        run: |
          archive=$(find npm-candidate -name 'mohitkale-reel-studio-*.tgz' -print -quit)
          test -n "$archive"
          npm run package:smoke -- "$archive"
      - name: Verify Windows launch separately with primed registry cache
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts
          archive=$(find npm-candidate -name 'mohitkale-reel-studio-*.tgz' -print -quit)
          test -n "$archive"
          REEL_STUDIO_SMOKE_NPM_CACHE="$(npm config get cache)" npm run package:smoke -- "$archive"
