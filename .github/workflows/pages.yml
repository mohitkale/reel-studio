name: Website

# Builds the project website (site/, docs/ and the example storyboards) and
# publishes it to GitHub Pages. Pages must be set to "GitHub Actions" as its
# source in the repository settings. The site has no analytics and sets no cookies.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/storyboards/**"
      - "scripts/build-site.ts"
      - "src/site/**"
      - ".github/workflows/pages.yml"
  # A pull request only builds the site (and checks its links); it never deploys.
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "examples/storyboards/**"
      - "scripts/build-site.ts"
      - "src/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The site builder needs only tsx; skip the install scripts (Prisma, voice models).
      - run: npm ci --ignore-scripts
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # The posters and the hero poster are small and first on screen: serve them from the
      # site itself. The videos stay on the demo-assets release and load only when played.
      - name: Fetch posters
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download demo-assets --repo "$GITHUB_REPOSITORY" --pattern "gallery-*.jpg" --pattern "hero-poster.jpg" --pattern "niche-*.jpg" --dir dist/posters
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run site:build -- --poster-dir dist/posters --site-url "${SITE_URL:-https://mohitkale.github.io/reel-studio/}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
