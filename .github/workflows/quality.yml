name: Quality
on:
  pull_request:
  push:
    branches: [main, codex/premium-production]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  process-cancellation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-process-tree.mjs
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip # CPU Kokoro does not use CUDA
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update
      - if: runner.os == 'Linux'
        run: sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install pinned Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2'
          # Gyan is a Windows build provider linked from ffmpeg.org/download.html.
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive
          $expected = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $destination
          $executables = @(Get-ChildItem -Path $destination -Filter ffmpeg.exe -Recurse -File)
          if ($executables.Count -ne 1) { throw 'Expected one FFmpeg executable' }
          $bin = $executables[0].DirectoryName
          if (-not (Test-Path (Join-Path $bin 'ffprobe.exe'))) { throw 'FFprobe is missing' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Run full unit and integration suite
        # Windows SQLite fixtures compete for disk/CPU under parallel workers.
        # Keep every test and existing deadline; reduce only worker concurrency.
        run: npm run test:unit -- --maxWorkers=${{ runner.os == 'Windows' && 1 || 2 }}
      - run: npm run security:scan
      - run: node scripts/dependency-inventory.mjs > dependency-inventory.json
      - run: npm run test:phonemizer
      - run: npm run release:check
      - run: npm run build
        env:
          DATABASE_URL: file:./ci.db
  renders:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update
      - run: sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run release:matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: render-regression
          path: |
            .artifacts/render-regression
            .artifacts/release-matrix
