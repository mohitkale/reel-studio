name: Quality
# Full gate: Linux and Windows, integration tests, build and release checks.
# Runs on main, nightly and on request. On a pull request it runs only when
# the PR carries the `ci:full` label or touches risky paths; every PR also
# gets the fast gate in ci.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether the full gate applies
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ] && [ "$FULL_LABEL" != "true" ]; then
            gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > changed.txt
            risky='^(prisma/|scripts/|src/library/|src/server/|vendor/|\.github/workflows/|package(-lock)?\.json$|vitest\.config\.mts$|next\.config\.ts$|Dockerfile$|docker-compose\.yml$)'
            if grep -qE "$risky" changed.txt; then
              echo "Risky paths changed:"; grep -E "$risky" changed.txt
            else
              run=false
              echo "No risky paths and no ci:full label; the fast gate in ci.yml covers this PR."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  process-cancellation:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-process-tree.mjs
  checks:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip # CPU Kokoro does not use CUDA
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux FFmpeg with mirror fallback
        if: runner.os == 'Linux'
        run: bash scripts/install-ci-ffmpeg.sh
      - name: Install pinned Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2'
          # Gyan is a Windows build provider linked from ffmpeg.org/download.html.
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive
          $expected = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $destination
          $executables = @(Get-ChildItem -Path $destination -Filter ffmpeg.exe -Recurse -File)
          if ($executables.Count -ne 1) { throw 'Expected one FFmpeg executable' }
          $bin = $executables[0].DirectoryName
          if (-not (Test-Path (Join-Path $bin 'ffprobe.exe'))) { throw 'FFprobe is missing' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Feature parity (docs/FEATURES.md matches routes, pages and MCP tools)
        run: npm run test:parity
      - name: Run integration tests
        # Windows SQLite fixtures compete for disk under parallel workers and
        # exceed their own deadlines; keep every deadline and use one worker.
        run: npm run test:int -- --maxWorkers=${{ runner.os == 'Windows' && 1 || 2 }}
      - run: npm run security:scan
      - run: node scripts/dependency-inventory.mjs > dependency-inventory.json
      - run: npm run test:phonemizer
      - run: npm run release:check
      - run: npm run build
        env:
          DATABASE_URL: file:./ci.db
  renders:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux FFmpeg with mirror fallback
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm ci
      - run: npm run release:matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: render-regression
          path: |
            .artifacts/render-regression
            .artifacts/release-matrix
  report-failure:
    needs: [process-cancellation, checks]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Full CI is failing on main"
          body="The full Quality gate failed on \`${GITHUB_SHA::7}\` ($GITHUB_EVENT_NAME): $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "area:ci" --label "priority:p0" --body "$body"
          fi
