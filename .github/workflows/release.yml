name: Release
# Pushing a `v*` tag (`npm run release -- tag`) runs the full gate, the render
# smoke test and the phonemizer corresponding-source build, then publishes the
# GitHub release with notes from CHANGELOG.md and the source archive attached.
# A manual run is a dry run: everything except publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      issues: write
    uses: ./.github/workflows/quality.yml
  phonemizer:
    permissions:
      contents: read
    uses: ./.github/workflows/phonemizer-source.yml
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip # CPU Kokoro does not use CUDA
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux FFmpeg with mirror fallback
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm ci
      - name: Render smoke test (real HyperFrames export)
        run: npx vitest run --project render
      - name: Copy fit (30 headlines in three formats, real browser)
        run: npm run test:copy-fit
  npm-candidate:
    needs: [phonemizer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-built-phonemizer
          path: phonemizer-source
      - run: npm ci
      - run: npm run voice:download
      - name: Build the standalone package and separate voice pack
        run: |
          source=$(find phonemizer-source -name reel-phonemizer-corresponding-source.tar.gz -print -quit)
          test -n "$source"
          npm run package:npm -- --voice-source "$source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reel-studio-npm-candidate
          path: |
            .artifacts/npm-package/candidate-*/mohitkale-reel-studio-*.tgz
            .artifacts/npm-package/candidate-*/reel-kokoro-voice-pack.json.gz
            .artifacts/npm-package/candidate-*/pack-report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  npm-smoke:
    needs: [npm-candidate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reel-studio-npm-candidate
          path: npm-candidate
      - name: Start with only Node from a clean directory
        shell: bash
        run: |
          archive=$(find npm-candidate -name 'mohitkale-reel-studio-*.tgz' -print -quit)
          test -n "$archive"
          npm run package:smoke -- "$archive"
  publish:
    needs: [gate, phonemizer, render-smoke, npm-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, package version and changelog agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$version" != "$package" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
          awk -v v="$version" '$0 ~ "^## " v "( |$)" { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-built-phonemizer
          path: phonemizer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reel-studio-npm-candidate
          path: npm-candidate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(find phonemizer -name reel-phonemizer-corresponding-source.tar.gz | head -n 1)
          if [ -z "$archive" ]; then
            echo "Phonemizer corresponding-source archive is missing" >&2
            exit 1
          fi
          cp "$archive" reel-phonemizer-corresponding-source.tar.gz
          voice_pack=$(find npm-candidate -name reel-kokoro-voice-pack.json.gz -print -quit)
          test -n "$voice_pack"
          cp "$voice_pack" reel-kokoro-voice-pack.json.gz
          sha256sum reel-phonemizer-corresponding-source.tar.gz reel-kokoro-voice-pack.json.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Reel Studio $GITHUB_REF_NAME" \
            --notes-file notes.md \
            reel-phonemizer-corresponding-source.tar.gz reel-kokoro-voice-pack.json.gz SHA256SUMS
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') && vars.REEL_STUDIO_PUBLISH_NPM == 'true'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reel-studio-npm-candidate
          path: npm-candidate
      - name: Publish the verified archive with npm provenance
        run: |
          archive=$(find npm-candidate -name 'mohitkale-reel-studio-*.tgz' -print -quit)
          test -n "$archive"
          npm publish "$archive" --access public --provenance
