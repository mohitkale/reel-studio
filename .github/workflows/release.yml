name: Release
# Pushing a `v*` tag (`npm run release -- tag`) runs the full gate, the render
# smoke test and the phonemizer corresponding-source build, then publishes the
# GitHub release with notes from CHANGELOG.md and the source archive attached.
# A manual run is a dry run: everything except publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      issues: write
    uses: ./.github/workflows/quality.yml
  phonemizer:
    permissions:
      contents: read
    uses: ./.github/workflows/phonemizer-source.yml
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux FFmpeg with mirror fallback
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm ci
      - name: Render smoke test (real HyperFrames export)
        run: npx vitest run --project render
      - name: Copy fit (30 headlines in three formats, real browser)
        run: npm run test:copy-fit
  publish:
    needs: [gate, phonemizer, render-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, package version and changelog agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$version" != "$package" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
          awk -v v="$version" '$0 ~ "^## " v "( |$)" { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-built-phonemizer
          path: phonemizer
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(find phonemizer -name reel-phonemizer-corresponding-source.tar.gz | head -n 1)
          if [ -z "$archive" ]; then
            echo "Phonemizer corresponding-source archive is missing" >&2
            exit 1
          fi
          cp "$archive" reel-phonemizer-corresponding-source.tar.gz
          sha256sum reel-phonemizer-corresponding-source.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Reel Studio $GITHUB_REF_NAME" \
            --notes-file notes.md \
            reel-phonemizer-corresponding-source.tar.gz SHA256SUMS
